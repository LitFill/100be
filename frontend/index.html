  </head>
  <body>
    <header class="container">
      <h1>URLs in server</h1>
    </header>
    <main
      x-init='
        loading       = true;
        statusMessage = "Loading items...";
        items         = [];
        try {
          const response = await fetch("http://localhost:8080/");
          if (!response.ok)
            throw new Error(`Server error: ${response.status}`);
          const data = await response.json();
          if (!data.length) statusMessage = "No items found.";
          else {
            items = data;
            statusMessage = "";
          }
        } catch (error) {
          statusMessage = `Error loading items: ${error.message}`;
        } finally {
          loading = false;
        }'
      x-data='{
          items:         [],
          loading:       false,
          search:        "",
          statusMessage: "Initializing...",

          get filteredItems() {
            if (!this.search.trim()) return this.items;
            const query = this.search.toLowerCase();
            return this.items.filter(item =&gt;
              item.short.toLowerCase().includes(query) ||
              item.long.toLowerCase().includes(query)
            );
          },
        }'
      role="main"
      class="container"
    >
      <article>
        <header>
          <strong> Create Short URL </strong>
        </header>
        <form
          @submit.prevent='
                submitting = true;
                formError = "";

                const body = new URLSearchParams();
                body.append("original-url", newUrl);

                try {
                  const response = await fetch("http://localhost:8080/shorten", {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: body
                  });

                  if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || `Server error: ${response.status}`);
                  }

                  const createdItem = await response.json();

                  // Optimistically add to top of list &amp; reset form
                  items.unshift(createdItem);
                  newUrl = "";
                  statusMessage = "";
                } catch (error) {
                  formError = error.message;
                } finally {
                  submitting = false;
                }'
          x-data="formService"
          method="POST"
          action="http://localhost:8080/shorten"
        >
          <fieldset role="group">
            <input
              :disabled="submitting"
              x-model="newUrl"
              placeholder="https://example.com/very/long/url"
              value=""
              type="url"
              name="original-url"
              required
            />
            <button :busy="submitting" :disabled="submitting" type="submit">
              Shorten
            </button>
          </fieldset>
        </form>
        <small
          style="color: var(--pico-del-color)"
          x-text="formError"
          x-show="formError"
        >
        </small>
      </article>
      <article>
        <input
          :disabled="items.length === 0"
          placeholder="Filter by short or long URL..."
          x-model="search"
          value=""
          type="text"
          name="search"
        />
        <p x-show="statusMessage !== ''" x-text="statusMessage">placeholder</p>
      </article>
      <p x-show="items.length > 0 && filteredItems.length === 0">
        No URLs match your search.
      </p>
      <div class="overflow-auto">
        <table x-show="filteredItems.length > 0">
          <thead>
            <tr>
              <th>Short</th>
              <th>Long</th>
            </tr>
          </thead>
          <tbody>
            <template :key="urlMap.short" x-for="urlMap in filteredItems">
              <tr>
                <td x-text="urlMap.short">placeholder</td>
                <td>
                  <a
                    x-text="urlMap.long"
                    target="_blank"
                    :href="urlMap.long"
                    href=""
                  >
                    placeholder
                  </a>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </main>
  </body>
