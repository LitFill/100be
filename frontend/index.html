      <article>
        <form @submit="submitting = true" x-data="{ submitting: false }" method="POST" action="http://localhost:8080/shorten">
          <fieldset role="group">

              Shorten
            </button>
          </fieldset>
        </form>
      </article>
      <article>
        <input :disabled="items.length === 0" placeholder="Filter by short or long URL..." x-model="search" value="" type="text" name="search">
        <p x-show="statusMessage !== ''" x-text="statusMessage">
          placeholder
        </p>
      </article>
      <p x-show="items.length > 0 && filteredItems.length === 0">
        No URLs match your search.
      </p>
      <div class="overflow-auto">
        <table x-show="filteredItems.length > 0">
          <thead>
            <tr>
              <th>

            </tr>
          </thead>
          <tbody>
            <template :key="urlMap.short" x-for="urlMap in filteredItems">
              <tr>

    <script>
      function urlService() {
        return {
          items:         [],
          loading:       false,
          search:        "",
          statusMessage: "Initializing...",

          get filteredItems() {
            if (!this.search.trim()) return this.items;
            const query = this.search.toLowerCase();
            return this.items.filter(item =>
              item.short.toLowerCase().includes(query) ||
              item.long.toLowerCase().includes(query)
            );
          },

          async fetchURLs() {
            this.loading       = true;
            this.statusMessage = "Loading items...";
            this.items         = [];
            try {
              const response = await fetch("http://localhost:8080/");
              if (!response.ok)
                throw new Error(`Server error: ${response.status}`);
              const data = await response.json();
              if (!data.length) this.statusMessage = "No items found.";
              else {
                this.items = data;
                this.statusMessage = "";
              }
            } catch (error) {
              this.statusMessage = `Error loading items: ${error.message}`;
            } finally {
              this.loading = false;
            }
          },
        };
      }
