  <body>
    <header class="container">
      <h1>
        URLs in server
      </h1>
    </header>
    <main x-init="
      loading       = true;
      statusMessage = &quot;Loading items...&quot;;
      items         = [];
      try {
        const response = await fetch(&quot;http://localhost:8080/&quot;);
        if (!response.ok)
          throw new Error(`Server error: ${response.status}`);
        const data = await response.json();
        if (!data.length) statusMessage = &quot;No items found.&quot;;
        else {
          items = data;
          statusMessage = &quot;&quot;;
        }
      } catch (error) {
        statusMessage = `Error loading items: ${error.message}`;
      } finally {
        loading = false;
      }" x-data="{
        items:         [],
        loading:       false,
        search:        &quot;&quot;,
        statusMessage: &quot;Initializing...&quot;,

        get filteredItems() {
          if (!this.search.trim()) return this.items;
          const query = this.search.toLowerCase();
          return this.items.filter(item =&gt;
            item.short.toLowerCase().includes(query) ||
            item.long.toLowerCase().includes(query)
          );
        },
      }" role="main" class="container">
      <article x-data="{ submitting: false, formError: '', newUrl: '' }">
        <header>
          <strong>
            Create Short URL
          </strong>
        </header>
        <form @submit.prevent="
              submitting = true;
              formError = &quot;&quot;;

              const body = new URLSearchParams();
              body.append(&quot;original-url&quot;, newUrl);

              try {
                const response = await fetch(&quot;http://localhost:8080/shorten&quot;, {
                  method: &quot;POST&quot;,
                  headers: {
                    &quot;Content-Type&quot;: &quot;application/x-www-form-urlencoded&quot;,
                  },
                  body: body
                });

                if (!response.ok) {
                  const text = await response.text();
                  throw new Error(text || `Server error: ${response.status}`);
                }

                const createdItem = await response.json();

                // Optimistically add to top of list &amp; reset form
                items.unshift(createdItem);
                newUrl = &quot;&quot;;
                statusMessage = &quot;&quot;;
              } catch (error) {
                formError = error.message;
              } finally {
                submitting = false;
              }" method="POST" action="http://localhost:8080/shorten">
          <fieldset role="group">
            <input :disabled="submitting" x-model="newUrl" placeholder="https://example.com/very/long/url" value="" type="url" name="original-url" required>
            <button :busy="submitting" :disabled="submitting" type="submit">
              Shorten
            </button>
          </fieldset>
        </form>
        <small style="color: var(--pico-del-color)" x-text="formError" x-show="formError">
          
        </small>
      </article>
      <article>
        <input :disabled="items.length === 0" placeholder="Filter by short or long URL..." x-model="search" value="" type="text" name="search">
        <p x-show="statusMessage !== ''" x-text="statusMessage">
          placeholder
        </p>
      </article>
      <p x-show="items.length > 0 && filteredItems.length === 0">
        No URLs match your search.
      </p>
      <div class="overflow-auto">
        <table x-show="filteredItems.length > 0">
          <thead>
            <tr>
              <th>
                Short
              </th>
              <th>
                Long
              </th>
              <th>
                action
              </th>
            </tr>
          </thead>
          <tbody>
            <template :key="urlMap.short" x-for="urlMap in filteredItems">
              <tr>
                <td x-text="urlMap.short">
                  placeholder
                </td>
                <td>
                  <a x-text="urlMap.long" target="_blank" :href="urlMap.long" href="">
                    placeholder
                  </a>
                </td>
                <td>
                  <button @click="
              if (!confirm(`Delete /${urlMap.short}?`)) return;
              const response = await fetch(`http://localhost:8080/${urlMap.short}`, {
                method: &quot;DELETE&quot;
              });
              items = items.filter(item =&gt; item.short !== urlMap.short);
              if (items.length === 0) statusMessage = &quot;No items found.&quot;;
              ">
                    delete
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
